name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - run: npm ci
      - run: npm ci --prefix renderer

      - run: npm test

      - run: npm run lint --prefix renderer

      - run: npm run renderer:build

      # Package the app on each native OS. This also rebuilds better-sqlite3
      # against the host Electron version, which cross-builds cannot do.
      - run: npx electron-builder --dir

  build:
    name: Build installers (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - run: npm ci
      - run: npm ci --prefix renderer

      - run: npm test

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npm run renderer:build && npx electron-builder --mac --publish never

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run renderer:build && npx electron-builder --win --config.win.signAndEditExecutable=false --publish never

      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: npm run renderer:build && npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
            dist-electron/latest*.yml
